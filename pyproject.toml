[project]
name = "calendar-digest"
version = "0.1.0"
description = "Daily Google Calendar + WSDOT traffic email digest, delivered via AWS Lambda."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py", "src/*/__init__.py"]
